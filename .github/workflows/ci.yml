name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Build the portable package
        run: ./scripts/Build-Release.ps1
      - name: Upload the portable package
        uses: actions/upload-artifact@v7
        with:
          name: YouTube-Music-windows-x64
          path: target/releases/YouTube-Music-*-windows-x64.zip*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
