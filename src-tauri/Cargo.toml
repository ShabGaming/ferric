[package]
name = "ferric"
version = "1.0.0"
description = "A lightweight YouTube Music desktop app for Windows"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/ShabGaming/ferric"
license = "MIT"
publish = false
autobins = false

[[bin]]
name = "youtube-music"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "~2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Media", "Media_Control", "Storage_Streams", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
winreg = "0.55"
